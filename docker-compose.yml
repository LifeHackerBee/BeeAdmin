version: '3.8'

services:
  bee-admin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 前端零密钥，只传公开配置（2026-11-12 认证改本地账号，Auth0 配置删除）
        - VITE_HYPERLIQUID_TRADER_API_URL=${VITE_HYPERLIQUID_TRADER_API_URL}
        - VITE_ALLOW_SIGNUP=${VITE_ALLOW_SIGNUP}
        - VITE_ALLOW_FORGOT_PASSWORD=${VITE_ALLOW_FORGOT_PASSWORD}
    container_name: bee-admin
    ports:
      - "3000:80"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - bee-admin-network

networks:
  bee-admin-network:
    driver: bridge
